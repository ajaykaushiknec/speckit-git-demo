git:
  # ── Feature Branch Settings ──
  feature_branch:
    naming: "sequential"        # "sequential" (001, 002...) or "timestamp" (20260923-143022)
    prefix: ""                  # monorepo support: "{author}/{app}" → ajay/backend/001-feature
    template: ""                # custom: "{author}/{app}/{number}-{slug}"
    main_branch: "main"         # feature branches isse create hongi

  # ── Auto Commit Settings ──
  # Har speckit command ke baad automatically commit hota hai
  auto_commit:
    default: true               # global toggle — false karo toh sab band
    commit_style: "fixed"       # "fixed" (config message) or "conventional" (AI-generated)

    after_specify:
      enabled: true
      message: "[Spec Kit] Add specification"

    after_clarify:
      enabled: true
      message: "[Spec Kit] Clarify specification"

    after_plan:
      enabled: true
      message: "[Spec Kit] Add implementation plan"

    after_tasks:
      enabled: true
      message: "[Spec Kit] Add tasks"

    after_implement:
      enabled: true
      message: "[Spec Kit] Implementation progress"

    after_checklist:
      enabled: false
      message: "[Spec Kit] Add checklist"

    after_analyze:
      enabled: false
      message: "[Spec Kit] Add analysis report"

    before_plan:
      enabled: true
      message: "[Spec Kit] Save progress before planning"

    before_implement:
      enabled: true
      message: "[Spec Kit] Save progress before implementation"

  # ── Auto Push Settings ──
  # Commit ke baad automatically remote pe push hota hai
  auto_push:
    default: false              # global toggle — true karo toh har commit ke baad push
    remote: "origin"            # kis remote pe push karna hai

    after_specify:
      enabled: false            # spec stage pe push nahi — abhi local review karo

    after_plan:
      enabled: false            # plan stage pe push nahi

    after_implement:
      enabled: true             # implementation ke baad push — code review ke liye ready
      create_pr: false          # true karo toh auto PR bhi banega

  # ── Init Settings ──
  init:
    commit_message: "[Spec Kit] Initial commit"
    default_branch: "main"

  # ── Scripts ──
  scripts:
    shell: "bash"
    path: "scripts/bash"
